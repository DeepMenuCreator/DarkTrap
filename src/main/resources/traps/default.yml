# Конфигурация трапки "default"
# Этот файл можно свободно редактировать - изменения применятся
# после перезапуска сервера (перезагрузки плагина).

name: "&7Default Trap"

item:
  material: STONE
  name: "&7Стандартная трапка"
  lore:
    - "&7Простая PvP-трапка"
    - "&7ПКМ чтобы установить"

# Время жизни конструкции трапки (в секундах) до автоматического удаления
duration: 10

# Задержка перед постройкой конструкции после использования (в тиках, 20 = 1 сек)
activation-delay: 0

# Перезарядка использования этой трапки для игрока (в секундах)
cooldown: 15

size:
  radius: 2
  height: 3

blocks:
  wall: STONE
  floor: STONE
  roof: STONE

effects:
  - type: SLOWNESS
    amplifier: 1
    duration: 40

# Необязательные переопределения сообщений именно для этой трапки.
# Если ключ не указан - используется сообщение из основного config.yml
messages: {}
